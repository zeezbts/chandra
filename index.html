<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column; /* Allows vertical stacking */
            justify-content: center;
            align-items: center;
            background-color: #fff0f3;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            transition: background 1.5s ease;
        }

        /* Container for Name and Card */
        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px; /* Space between name and card */
        }

        /* The Name - Appears above the card */
        #finalName {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ff4b6e;
            text-shadow: 2px 2px 10px rgba(255, 75, 110, 0.3);
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
        }

        .card {
            text-align: center;
            width: 350px;
            padding: 40px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 75, 110, 0.2);
            animation: slideUp 1.2s ease-out;
            position: relative;
            z-index: 10;
        }

        h1 { color: #ff4b6e; font-size: 24px; margin-bottom: 15px; }
        p { color: #444; line-height: 1.6; font-size: 16px; }

        .heart-btn {
            font-size: 60px;
            cursor: pointer;
            display: inline-block;
            margin-top: 20px;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .confetti {
            position: absolute;
            width: 10px; height: 10px;
            animation: fall linear forwards;
            z-index: 5;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Name will pop up here -->
        <div id="finalName">Sandy ❤️ Chandra <br>  I LOVE YOU</div>

        <div class="card" id="mainCard">
            <h1>TO MY SOUL... ❤️</h1>
            <p>
                Nee no sollita. Aana enna la marakka mudiyala.unna paththi mattume mind nenachutu  erukku. yosuchukooda sollu da.
                unna pakkanumpola erukku da.<br>
                <br>
                <b>Yes solluvenu nampure 💕</b>
                <br><br>
                <b>I LOVE YOU </b>
                <br><br>
                Yes na keela erukka heart ah click pannu!
            </p>
            <div class="heart-btn" onclick="celebrate()">❤️</div>
        </div>
    </div>

    <script>
        function celebrate() {
            // 1. Light up the background
            document.body.style.backgroundColor = "#ffe3e8";
            
            // 2. Show the names above the card
            const nameDiv = document.getElementById('finalName');
            nameDiv.style.opacity = "1";
            nameDiv.style.transform = "scale(1)";

            // 3. Confetti explosion
            for(let i=0; i<100; i++) {
                let confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = "-10px";
                confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 70%)`;
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 5000);
            }
        }
    </script>
</body>
</html>
